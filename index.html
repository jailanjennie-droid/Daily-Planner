```html
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Planner</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
        min-height: 100vh;
        margin: 0;
        padding: 30px 15px;
    }

    .planner {
        background: white;
        max-width: 600px;
        margin: auto;
        padding: 35px 30px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        animation: fadeIn 0.6s ease;
    }

    h1 {
        color: #8e44ad;
        margin-bottom: 10px;
    }

    h2 {
        color: #6c3483;
        margin-top: 25px;
    }

    p {
        color: #666;
        font-size: 18px;
    }

    button {
        background: #8e44ad;
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 15px;
        font-size: 18px;
        cursor: pointer;
        margin: 8px;
        transition: 0.2s;
    }

    button:hover {
        background: #6c3483;
        transform: scale(1.05);
    }

    #startButton {
        margin-top: 15px;
        padding: 16px 30px;
        font-size: 19px;
    }

    #appContent {
        display: none;
        animation: slideUp 0.5s ease;
    }

    #plan {
        animation: fadeIn 0.5s ease;
    }

    /* Plan Button */
    #planButton {
        background: linear-gradient(135deg, #8e44ad, #e84393);
    }

    /* Add Task */
    .add-task-box {
        margin: 20px 0;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .add-task-box input {
        padding: 12px 18px;
        font-size: 16px;
        border: 2px solid #e6d6ff;
        border-radius: 12px;
        outline: none;
        width: 65%;
    }

    .add-task-box input:focus {
        border-color: #8e44ad;
    }

    /* Tasks */
    .task {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8eaf4;
        margin: 10px 0;
        padding: 14px;
        border-radius: 12px;
        text-align: left;
        font-size: 17px;
        cursor: grab;
        user-select: none;
        transition: background 0.2s, opacity 0.2s, transform 0.2s;
        animation: taskAppear 0.35s ease;
    }

    .task:hover {
        transform: translateX(3px);
    }

    .task:active {
        cursor: grabbing;
    }

    .task.dragging {
        opacity: 0.4;
    }

    .task input {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: #8e44ad;
    }

    .task input:checked + span {
        text-decoration: line-through;
        opacity: 0.5;
    }

    /* Progress Bar */
    #progress-container {
        display: none;
        margin: 25px 0 15px 0;
        animation: fadeIn 0.5s ease;
    }

    #progress-text {
        color: #8e44ad;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    #progress-bar {
        width: 100%;
        height: 20px;
        background: #eee;
        border-radius: 15px;
        overflow: hidden;
    }

    #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #8e44ad, #e84393);
        border-radius: 15px;
        transition: width 0.4s ease;
    }

    /* Trash */
    #drop-trash {
        display: none;
        margin: 20px auto 10px auto;
        padding: 18px;
        border: 2px dashed #ff7675;
        border-radius: 15px;
        background-color: #ffeae8;
        color: #d63031;
        font-weight: bold;
        font-size: 17px;
        transition: all 0.3s ease;
    }

    #drop-trash.drag-over {
        background-color: #ff7675;
        color: white;
        transform: scale(1.03);
        border-style: solid;
    }

    #tasks {
        margin-top: 20px;
    }

    /* Completion */
    #completionArea {
        display: none;
        animation: fadeIn 0.6s ease;
    }

    #star {
        font-size: 60px;
        margin: 20px;
        animation: starPop 0.6s ease;
    }

    #doneButton {
        background: #e84393;
    }

    #message {
        display: none;
        font-size: 24px;
        color: #8e44ad;
        font-weight: bold;
        margin-top: 20px;
        animation: fadeIn 0.5s ease;
    }

    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes taskAppear {
        from {
            opacity: 0;
            transform: translateX(-10px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes starPop {
        0% {
            transform: scale(0);
        }

        70% {
            transform: scale(1.2);
        }

        100% {
            transform: scale(1);
        }
    }

    /* Mobile */
    @media (max-width: 500px) {
        .planner {
            padding: 25px 18px;
        }

        .add-task-box {
            flex-direction: column;
        }

        .add-task-box input {
            width: 100%;
        }

        .add-task-box button {
            width: 100%;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>

</head>

<body>

<div class="planner">

<!-- Welcome Screen -->

<div id="welcomeScreen">

    <h1>🌸 Hi! This Is The Daily Planner 🌸</h1>

    <p>Let's make today a beautiful day! 💖</p>

    <button id="startButton" onclick="startPlanner()">
        Let's Start ✨
    </button>

</div>


<!-- Main App -->

<div id="appContent">

    <div id="plan"></div>

    <!-- Plan Button -->

    <button id="planButton" onclick="changePlan()">
        Let's Start ✨
    </button>

    <hr>


    <!-- Add Task -->

    <div class="add-task-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Write a new task here..."
        >

        <button id="addTaskButton">
            ✨ Add Task
        </button>

    </div>


    <div id="tasks"></div>


    <!-- Progress Bar -->

    <div id="progress-container">

        <div id="progress-text">
            Progress: 0%
        </div>

        <div id="progress-bar">

            <div id="progress-fill"></div>

        </div>

    </div>


    <!-- Trash -->

    <div id="drop-trash">
        🗑️ Drag & Drop task here to delete
    </div>


    <!-- Completion Area -->

    <div id="completionArea">

        <div id="star">
            ⭐
        </div>

        <button id="doneButton">
            🎉 Done!
        </button>

    </div>


    <!-- Final Message -->

    <div id="message">
        🌸 Done! Have a good day! 💖
    </div>

</div>

</div>


<script>

let currentPlan = 0;


/* Built-in Plans */

const plans = [

    {
        title: "🌅 Morning Plan",
        nextButton: "☀️ Afternoon Plan",
        tasks: [
            "Wake up",
            "Make my bed",
            "Pray",
            "Important meeting",
            "Breakfast",
            "Skincare",
            "Review homework",
            "Wear uniform",
            "Go to school"
        ]
    },

    {
        title: "☀️ Afternoon Plan",
        nextButton: "🌆 Evening Plan",
        tasks: [
            "Change your clothes",
            "Wash your face",
            "Eat lunch",
            "Check your school schedule for the next day",
            "Pray",
            "Iron your uniform",
            "Study",
            "Rest"
        ]
    },

    {
        title: "🌆 Evening Plan",
        nextButton: "🌙 Night Plan",
        tasks: [
            "Review",
            "Pray",
            "Dinner",
            "Help my mom"
        ]
    },

    {
        title: "🌙 Night Plan",
        nextButton: "🌅 Morning Plan",
        tasks: [
            "Game",
            "Review",
            "Pray",
            "Spend some time with my family",
            "Night routine",
            "Get ready for bed"
        ]
    }

];


/* =========================
   SAVE TASKS
========================= */

function saveTasks() {

    const savedData = {};

    plans.forEach(function(plan, index) {

        const planTasks =
            document.querySelectorAll(
                "#plan .task"
            );

        if (index === currentPlan) {

            savedData[index] = [];

            planTasks.forEach(function(task) {

                const checkbox =
                    task.querySelector("input");

                const text =
                    task.querySelector("span").textContent;

                savedData[index].push({
                    text: text,
                    completed: checkbox.checked
                });

            });

        }

    });


    /* Save custom tasks too */

    const customTasks =
        document.querySelectorAll(
            "#tasks .task"
        );

    savedData.customTasks = [];

    customTasks.forEach(function(task) {

        const checkbox =
            task.querySelector("input");

        const text =
            task.querySelector("span").textContent;

        savedData.customTasks.push({
            text: text,
            completed: checkbox.checked
        });

    });


    localStorage.setItem(
        "dailyPlannerTasks",
        JSON.stringify(savedData)
    );

}


/* =========================
   LOAD SAVED TASKS
========================= */

function getSavedTasks() {

    const saved =
        localStorage.getItem(
            "dailyPlannerTasks"
        );

    if (!saved) {
        return {};
    }

    try {

        return JSON.parse(saved);

    } catch (error) {

        return {};

    }

}


/* Start Planner */

function startPlanner() {

    document.getElementById(
        "welcomeScreen"
    ).style.display = "none";

    document.getElementById(
        "appContent"
    ).style.display = "block";

    document.getElementById(
        "progress-container"
    ).style.display = "block";

    document.getElementById(
        "drop-trash"
    ).style.display = "block";

    loadPlan();

}


/* Change Plan */

function changePlan() {

    /* Save current plan before leaving */

    saveTasks();

    currentPlan++;

    if (currentPlan >= plans.length) {

        currentPlan = 0;

    }

    loadPlan();

}


/* Load Plan */

function loadPlan() {

    const plan =
        plans[currentPlan];

    const saved =
        getSavedTasks();

    let html =
        "<h2>" +
        plan.title +
        "</h2>";


    /* Check if this plan has saved tasks */

    const savedPlanTasks =
        saved[currentPlan];


    if (
        savedPlanTasks &&
        savedPlanTasks.length > 0
    ) {

        savedPlanTasks.forEach(function(task) {

            html += `
                <label class="task">

                    <input
                        type="checkbox"
                        onchange="checkAllTasks(); saveTasks()"
                        ${task.completed ? "checked" : ""}
                    >

                    <span>${task.text}</span>

                </label>
            `;

        });

    } else {

        /* First time loading the plan */

        plan.tasks.forEach(function(task) {

            html += `
                <label class="task">

                    <input
                        type="checkbox"
                        onchange="checkAllTasks(); saveTasks()"
                    >

                    <span>${task}</span>

                </label>
            `;

        });

    }


    const planContainer =
        document.getElementById("plan");

    planContainer.innerHTML = html;


    const loadedTasks =
        planContainer.querySelectorAll(".task");

    loadedTasks.forEach(
        makeTaskDraggable
    );


    /* Change button text */

    document.getElementById(
        "planButton"
    ).textContent =
        plan.nextButton;


    /* Load custom tasks */

    loadCustomTasks();


    /* Reset completion */

    document.getElementById(
        "completionArea"
    ).style.display = "none";

    document.getElementById(
        "message"
    ).style.display = "none";


    checkAllTasks();

}


/* Load Custom Tasks */

function loadCustomTasks() {

    const saved =
        getSavedTasks();

    const tasksContainer =
        document.getElementById("tasks");

    tasksContainer.innerHTML = "";


    if (
        saved.customTasks &&
        saved.customTasks.length > 0
    ) {

        saved.customTasks.forEach(function(taskData) {

            const task =
                document.createElement("label");

            task.className = "task";

            task.innerHTML = `
                <input
                    type="checkbox"
                    onchange="checkAllTasks(); saveTasks()"
                    ${taskData.completed ? "checked" : ""}
                >

                <span>${taskData.text}</span>
            `;

            makeTaskDraggable(task);

            tasksContainer.appendChild(task);

        });

    }

}


/* Make Task Draggable */

function makeTaskDraggable(taskElement) {

    taskElement.setAttribute(
        "draggable",
        "true"
    );


    taskElement.addEventListener(
        "dragstart",
        function(e) {

            taskElement.classList.add(
                "dragging"
            );

            e.dataTransfer.setData(
                "text/plain",
                ""
            );

        }
    );


    taskElement.addEventListener(
        "dragend",
        function() {

            taskElement.classList.remove(
                "dragging"
            );

        }
    );

}


/* Add Task */

const addTaskButton =
    document.getElementById(
        "addTaskButton"
    );

const taskInput =
    document.getElementById(
        "taskInput"
    );

const tasks =
    document.getElementById(
        "tasks"
    );


function addNewTask() {

    const taskText =
        taskInput.value.trim();


    if (taskText !== "") {

        const task =
            document.createElement(
                "label"
            );

        task.className = "task";


        task.innerHTML = `
            <input
                type="checkbox"
                onchange="checkAllTasks(); saveTasks()"
            >

            <span>${taskText}</span>
        `;


        makeTaskDraggable(task);

        tasks.appendChild(task);

        taskInput.value = "";


        /* Save immediately */

        saveTasks();

        checkAllTasks();

    }

}


addTaskButton.addEventListener(
    "click",
    addNewTask
);


taskInput.addEventListener(
    "keypress",
    function(e) {

        if (e.key === "Enter") {

            addNewTask();

        }

    }
);


/* Trash Zone */

const dropTrash =
    document.getElementById(
        "drop-trash"
    );


dropTrash.addEventListener(
    "dragover",
    function(e) {

        e.preventDefault();

        dropTrash.classList.add(
            "drag-over"
        );

    }
);


dropTrash.addEventListener(
    "dragleave",
    function() {

        dropTrash.classList.remove(
            "drag-over"
        );

    }
);


dropTrash.addEventListener(
    "drop",
    function(e) {

        e.preventDefault();

        dropTrash.classList.remove(
            "drag-over"
        );


        const draggingTask =
            document.querySelector(
                ".task.dragging"
            );


        if (draggingTask) {

            draggingTask.remove();

            saveTasks();

            checkAllTasks();

        }

    }
);


/* Check Tasks + Progress */

function checkAllTasks() {

    const allTasks =
        document.querySelectorAll(
            'input[type="checkbox"]'
        );


    const completedTasks =
        document.querySelectorAll(
            'input[type="checkbox"]:checked'
        );


    const progressFill =
        document.getElementById(
            "progress-fill"
        );


    const progressText =
        document.getElementById(
            "progress-text"
        );


    const completionArea =
        document.getElementById(
            "completionArea"
        );


    let progress = 0;


    if (allTasks.length > 0) {

        progress =
            Math.round(
                (
                    completedTasks.length /
                    allTasks.length
                ) * 100
            );

    }


    progressFill.style.width =
        progress + "%";


    progressText.textContent =
        "Progress: " +
        progress +
        "%";


    /* Everything completed */

    if (
        allTasks.length > 0 &&
        completedTasks.length ===
        allTasks.length
    ) {

        completionArea.style.display =
            "block";

    } else {

        completionArea.style.display =
            "none";

        document.getElementById(
            "message"
        ).style.display =
            "none";

    }

}


/* Done Button */

document.getElementById(
    "doneButton"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "message"
        ).style.display =
            "block";

        this.style.display =
            "none";

    }
);

</script>

</body>
</html>
```
