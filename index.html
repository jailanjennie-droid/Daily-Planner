<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }

        .planner {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #8e44ad;
        }

        h2 {
            color: #6c3483;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        button {
            background: #8e44ad;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            margin: 8px;
            transition: 0.2s;
        }

        button:hover {
            background: #6c3483;
            transform: scale(1.05);
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8eaf4;
            margin: 10px 0;
            padding: 14px;
            border-radius: 12px;
            text-align: left;
            font-size: 17px;
        }

        .task input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task input:checked + span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        #star {
            display: none;
            font-size: 60px;
            margin: 20px;
        }

        #tasks {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="planner">

    <h1>🌸 Hi! This Is The Daily Planner 🌸</h1>

    <p>Let's make today a beautiful day! 💖</p>

    <button onclick="nextPlan()">Let's Start ✨</button>

    <div id="plan"></div>

    <hr>

    <button id="add-task">✨ Add Task</button>

    <div id="tasks"></div>

    <div id="star">⭐</div>

</div>

<script>

let currentPlan = 0;

const plans = [

    {
        title: "🌅 Morning Plan",
        tasks: [
            "Wake up",
            "Make my bed",
            "Pray",
            "Important meeting",
            "Breakfast",
            "Skincare",
            "Review homework",
            "Wear uniform",
            "Go to school"
        ]
    },

    {
        title: "☀️ Afternoon Plan",
        tasks: [
            "Change your clothes",
            "Wash your face",
            "Eat lunch",
            "Check your school schedule for the next day",
            "Pray",
            "Iron your uniform",
            "Study",
            "Rest"
        ]
    },

    {
        title: "🌆 Evening Plan",
        tasks: [
            "Review",
            "Pray",
            "Dinner",
            "Help my mom"
        ]
    },

    {
        title: "🌙 Night Plan",
        tasks: [
            "Game",
            "Review",
            "Pray",
            "Spend some time with my family",
            "Night routine",
            "Get ready for bed"
        ]
    }

];

function nextPlan() {

    const plan = plans[currentPlan];

    let html = "<h2>" + plan.title + "</h2>";

    plan.tasks.forEach(function(task, index) {

        html += `
            <label class="task">
                <input type="checkbox" onchange="checkAllTasks()">
                <span>${task}</span>
            </label>
        `;

    });

    document.getElementById("plan").innerHTML = html;

    currentPlan++;

    if (currentPlan >= plans.length) {
        currentPlan = 0;
    }

    checkAllTasks();
}


const addTaskButton = document.getElementById("add-task");

const tasks = document.getElementById("tasks");


addTaskButton.addEventListener("click", function () {

    const taskText = prompt("What task do you want to add?");

    if (taskText && taskText.trim() !== "") {

        const task = document.createElement("label");

        task.className = "task";

        task.innerHTML = `
            <input type="checkbox">
            <span>${taskText}</span>
        `;

        tasks.appendChild(task);

        task.querySelector("input").addEventListener("change", checkAllTasks);

        checkAllTasks();
    }

});


function checkAllTasks() {

    const allTasks = document.querySelectorAll('input[type="checkbox"]');

    const completedTasks =
        document.querySelectorAll('input[type="checkbox"]:checked');

    const star = document.getElementById("star");

    if (allTasks.length > 0 && completedTasks.length === allTasks.length) {

        star.style.display = "block";

    } else {

        star.style.display = "none";

    }

}

</script>

</body>
</html>
