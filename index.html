<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Planner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px;
    transition: 0.3s;
}

body.dark {
    background: linear-gradient(135deg, #1e1b2e, #302040);
    color: white;
}

.planner {
    background: white;
    max-width: 650px;
    margin: auto;
    padding: 35px 30px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: fadeIn 0.6s ease;
    transition: 0.3s;
}

body.dark .planner {
    background: #242033;
    color: white;
}

h1 {
    color: #8e44ad;
    margin-bottom: 10px;
}

h2 {
    color: #6c3483;
    margin-top: 25px;
}

body.dark h2 {
    color: #d7a7f5;
}

h3 {
    color: #8e44ad;
}

body.dark h3 {
    color: #e0aaff;
}

p {
    color: #666;
    font-size: 18px;
}

body.dark p {
    color: #ccc;
}

button {
    background: #8e44ad;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 15px;
    font-size: 17px;
    cursor: pointer;
    margin: 8px;
    transition: 0.2s;
}

button:hover {
    background: #6c3483;
    transform: scale(1.05);
}

#startButton {
    margin-top: 15px;
    padding: 16px 30px;
    font-size: 19px;
}

#appContent {
    display: none;
    animation: slideUp 0.5s ease;
}

#plan {
    animation: fadeIn 0.5s ease;
}


/* =========================
   THREE DOT MENU
========================= */

.top-bar {
    display: flex;
    justify-content: flex-end;
    position: relative;
    margin-bottom: 10px;
}

.menu-button {
    background: transparent;
    color: #8e44ad;
    font-size: 30px;
    padding: 2px 10px;
    margin: 0;
    border-radius: 10px;
}

.menu-button:hover {
    background: #f3e5f5;
    transform: none;
}

body.dark .menu-button {
    color: #e0aaff;
}

body.dark .menu-button:hover {
    background: #342d46;
}

.menu {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    background: white;
    width: 190px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    padding: 8px;
    z-index: 100;
    text-align: left;
}

.menu.show {
    display: block;
    animation: fadeIn 0.2s ease;
}

body.dark .menu {
    background: #302b43;
}

.menu-item {
    width: 100%;
    margin: 0;
    padding: 12px 14px;
    background: transparent;
    color: #6c3483;
    text-align: left;
    border-radius: 10px;
    font-size: 15px;
}

.menu-item:hover {
    background: #f3e5f5;
    transform: none;
}

body.dark .menu-item {
    color: #f0d9ff;
}

body.dark .menu-item:hover {
    background: #40394f;
}


/* =========================
   DATE
========================= */

.date-box {
    margin: 15px 0;
}

.date-box label {
    font-weight: bold;
    color: #8e44ad;
}

.date-box input {
    padding: 10px;
    border: 2px solid #e6d6ff;
    border-radius: 10px;
    font-size: 16px;
    margin-left: 5px;
}

body.dark .date-box input {
    background: #302b43;
    color: white;
    border-color: #6c3483;
}


/* =========================
   PLAN BUTTON
========================= */

#planButton {
    background: linear-gradient(135deg, #8e44ad, #e84393);
}


/* =========================
   ADD TASK
========================= */

.add-task-box {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.add-task-box input[type="text"] {
    padding: 12px 18px;
    font-size: 16px;
    border: 2px solid #e6d6ff;
    border-radius: 12px;
    outline: none;
    width: 55%;
}

.add-task-box input[type="time"] {
    padding: 12px;
    font-size: 16px;
    border: 2px solid #e6d6ff;
    border-radius: 12px;
}

.add-task-box input:focus {
    border-color: #8e44ad;
}

body.dark .add-task-box input {
    background: #302b43;
    color: white;
    border-color: #6c3483;
}


/* =========================
   TASKS
========================= */

#planTasks,
#customTasks {
    margin-top: 15px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8eaf4;
    margin: 10px 0;
    padding: 12px;
    border-radius: 12px;
    text-align: left;
    font-size: 17px;
    user-select: none;
    transition: 0.2s;
    animation: taskAppear 0.35s ease;
}

body.dark .task {
    background: #342d46;
}

.task:hover {
    transform: translateX(3px);
}

.task input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #8e44ad;
    flex-shrink: 0;
}

.task-text {
    flex: 1;
}

.task input[type="checkbox"]:checked + .task-text {
    text-decoration: line-through;
    opacity: 0.5;
}

.task-time {
    color: #8e44ad;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
}

body.dark .task-time {
    color: #e0aaff;
}

.delete-task {
    background: #ff7675;
    padding: 7px 10px;
    font-size: 13px;
    margin: 0;
}

.delete-task:hover {
    background: #d63031;
}


/* =========================
   PROGRESS BAR
========================= */

#progress-container {
    margin: 25px 0 15px 0;
    animation: fadeIn 0.5s ease;
}

#progress-text {
    color: #8e44ad;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

#progress-bar {
    width: 100%;
    height: 20px;
    background: #eee;
    border-radius: 15px;
    overflow: hidden;
}

body.dark #progress-bar {
    background: #40394f;
}

#progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #8e44ad, #e84393);
    border-radius: 15px;
    transition: width 0.4s ease;
}


/* =========================
   TRASH
========================= */

#drop-trash {
    margin: 20px auto 10px auto;
    padding: 18px;
    border: 2px dashed #ff7675;
    border-radius: 15px;
    background-color: #ffeae8;
    color: #d63031;
    font-weight: bold;
    font-size: 17px;
    transition: all 0.3s ease;
}

#drop-trash.drag-over {
    background-color: #ff7675;
    color: white;
}


/* =========================
   COMPLETION
========================= */

#completionArea {
    display: none;
    animation: fadeIn 0.6s ease;
}

#star {
    font-size: 60px;
    margin: 20px;
    animation: starPop 0.6s ease;
}

#doneButton {
    background: #e84393;
}

#message {
    display: none;
    font-size: 24px;
    color: #8e44ad;
    font-weight: bold;
    margin-top: 20px;
}

body.dark #message {
    color: #e0aaff;
}


/* =========================
   DAILY REPORT
========================= */

#reportBox {
    background: #f8eaf4;
    border-radius: 15px;
    padding: 18px;
    margin-top: 25px;
    text-align: left;
}

body.dark #reportBox {
    background: #342d46;
}

#reportBox h3 {
    text-align: center;
}

.report-item {
    margin: 8px 0;
    font-size: 16px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes slideUp {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes taskAppear {

    from {
        opacity: 0;
        transform: translateX(-10px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

@keyframes starPop {

    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .planner {
        padding: 25px 18px;
    }

    .add-task-box {
        flex-direction: column;
    }

    .add-task-box input[type="text"],
    .add-task-box input[type="time"] {
        width: 100%;
    }

    .add-task-box button {
        width: 100%;
    }

    h1 {
        font-size: 26px;
    }

    .task {
        font-size: 15px;
    }

    .task-time {
        font-size: 12px;
    }

}

</style>

</head>

<body>

<div class="planner">


<!-- =========================
     WELCOME SCREEN
========================= -->

<div id="welcomeScreen">

    <h1>🌸 Hi! This Is The Daily Planner 🌸</h1>

    <p>Let's make today a beautiful day! 💖</p>

    <button id="startButton" onclick="startPlanner()">
        Let's Start ✨
    </button>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="appContent">


    <!-- THREE DOT MENU -->

    <div class="top-bar">

        <button
            class="menu-button"
            onclick="toggleMenu()"
            aria-label="Open menu"
        >
            ⋮
        </button>


        <div id="menu" class="menu">

            <button
                class="menu-item"
                onclick="toggleDarkMode()"
            >
                🌙 Dark Mode
            </button>

            <button
                class="menu-item"
                onclick="showStreak()"
            >
                🔥 Daily Streak
            </button>

        </div>

    </div>


    <!-- DATE
         ONLY VISIBLE ON NIGHT PLAN -->

    <div
        id="dateSection"
        class="date-box"
        style="display:none;"
    >

        <label for="plannerDate">
            📅 Date:
        </label>

        <input
            type="date"
            id="plannerDate"
        >

    </div>


    <!-- DAILY STREAK
         HIDDEN FROM MAIN PAGE -->

    <div
        id="streakBox"
        style="display:none;"
    >
        🔥 Daily Streak: 0 days
    </div>


    <!-- PLAN -->

    <div id="plan"></div>

    <div id="planTasks"></div>


    <!-- PLAN BUTTON -->

    <button
        id="planButton"
        onclick="changePlan()"
    >
        ☀️ Afternoon Plan
    </button>


    <hr>


    <!-- ADD TASK -->

    <h3>➕ Add Your Own Task</h3>

    <div class="add-task-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Write a new task here..."
        >

        <input
            type="time"
            id="taskTime"
        >

        <button id="addTaskButton">
            ✨ Add Task
        </button>

    </div>


    <div id="customTasks"></div>


    <!-- PROGRESS BAR -->

    <div id="progress-container">

        <div id="progress-text">
            Progress: 0%
        </div>

        <div id="progress-bar">

            <div id="progress-fill"></div>

        </div>

    </div>


    <!-- TRASH -->

    <div id="drop-trash">
        🗑️ Drag & Drop task here to delete
    </div>


    <!-- COMPLETION -->

    <div id="completionArea">

        <div id="star">
            ⭐
        </div>

        <button id="doneButton">
            🎉 Done!
        </button>

    </div>


    <!-- FINAL MESSAGE -->

    <div id="message">
        🌸 Done! Have a good day! 💖
    </div>


    <!-- =========================
         DAILY REPORT
         ONLY VISIBLE ON NIGHT PLAN
    ========================= -->

    <div
        id="reportBox"
        style="display:none;"
    >

        <h3>📊 Daily Report</h3>

        <div class="report-item">

            📅 Date:
            <span id="reportDate">-</span>

        </div>

        <div class="report-item">

            📝 Total Tasks:
            <span id="reportTotal">0</span>

        </div>

        <div class="report-item">

            ✅ Completed:
            <span id="reportCompleted">0</span>

        </div>

        <div class="report-item">

            ⏳ Remaining:
            <span id="reportRemaining">0</span>

        </div>

        <div class="report-item">

            📈 Progress:
            <span id="reportProgress">0%</span>

        </div>

    </div>


</div>

</div>


<script>

/* =========================
   PLANS
========================= */

const plans = [

    {
        title: "🌅 Morning Plan",
        nextButton: "☀️ Afternoon Plan",

        tasks: [
            "Wake up",
            "Make my bed",
            "Pray",
            "Important meeting",
            "Breakfast",
            "Skincare",
            "Review homework",
            "Wear uniform",
            "Go to school"
        ]
    },

    {
        title: "☀️ Afternoon Plan",
        nextButton: "🌆 Evening Plan",

        tasks: [
            "Change your clothes",
            "Wash your face",
            "Eat lunch",
            "Check your school schedule for the next day",
            "Pray",
            "Iron your uniform",
            "Study",
            "Rest"
        ]
    },

    {
        title: "🌆 Evening Plan",
        nextButton: "🌙 Night Plan",

        tasks: [
            "Review",
            "Pray",
            "Dinner",
            "Help my mom"
        ]
    },

    {
        title: "🌙 Night Plan",
        nextButton: "🌅 Morning Plan",

        tasks: [
            "Game",
            "Review",
            "Pray",
            "Spend some time with my family",
            "Night routine",
            "Get ready for bed"
        ]
    }

];


/* =========================
   VARIABLES
========================= */

let currentPlan = 0;

let selectedDate = "";

let customTasksData = [];


/* =========================
   ELEMENTS
========================= */

const welcomeScreen =
    document.getElementById("welcomeScreen");

const appContent =
    document.getElementById("appContent");

const plan =
    document.getElementById("plan");

const planTasks =
    document.getElementById("planTasks");

const customTasks =
    document.getElementById("customTasks");

const taskInput =
    document.getElementById("taskInput");

const taskTime =
    document.getElementById("taskTime");

const plannerDate =
    document.getElementById("plannerDate");

const progressFill =
    document.getElementById("progress-fill");

const progressText =
    document.getElementById("progress-text");

const menu =
    document.getElementById("menu");

const dateSection =
    document.getElementById("dateSection");

const reportBox =
    document.getElementById("reportBox");

const streakBox =
    document.getElementById("streakBox");


/* =========================
   START PLANNER
========================= */

function startPlanner() {

    welcomeScreen.style.display = "none";

    appContent.style.display = "block";


    const today =
        new Date().toISOString().split("T")[0];


    plannerDate.value = today;

    selectedDate = today;


    loadSavedData();

    loadPlan();

    updateAll();

}


/* =========================
   THREE DOT MENU
========================= */

function toggleMenu() {

    menu.classList.toggle("show");

}


document.addEventListener(
    "click",
    function(event) {

        const topBar =
            document.querySelector(".top-bar");

        if (!topBar.contains(event.target)) {

            menu.classList.remove("show");

        }

    }
);


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.body.classList.toggle("dark");


    const dark =
        document.body.classList.contains("dark");


    localStorage.setItem(
        "dailyPlannerDarkMode",
        dark
    );

}


function loadDarkMode() {

    const dark =
        localStorage.getItem(
            "dailyPlannerDarkMode"
        );


    if (dark === "true") {

        document.body.classList.add("dark");

    }

}


loadDarkMode();


/* =========================
   SHOW STREAK
========================= */

function showStreak() {

    const streak =
        calculateStreak();


    alert(
        "🔥 Your Daily Streak is " +
        streak +
        " day" +
        (streak === 1 ? "" : "s") +
        "!"
    );


    menu.classList.remove("show");

}


/* =========================
   DATE
========================= */

plannerDate.addEventListener(
    "change",
    function() {

        selectedDate =
            plannerDate.value;


        loadSavedData();

        loadPlan();

        updateAll();

    }
);


/* =========================
   SAVE / LOAD
========================= */

function getStorageKey() {

    return "dailyPlanner_" +
        selectedDate;

}


function saveData() {

    const data = {

        currentPlan:
            currentPlan,

        customTasks:
            customTasksData

    };


    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(data)
    );

}


function loadSavedData() {

    const saved =
        localStorage.getItem(
            getStorageKey()
        );


    if (saved) {

        const data =
            JSON.parse(saved);


        currentPlan =
            data.currentPlan || 0;


        customTasksData =
            data.customTasks || [];

    }

    else {

        currentPlan = 0;

        customTasksData = [];

    }

}


/* =========================
   PLAN
========================= */

function changePlan() {

    currentPlan++;


    if (
        currentPlan >=
        plans.length
    ) {

        currentPlan = 0;

    }


    saveData();

    loadPlan();

    updateAll();

}


function loadPlan() {

    const current =
        plans[currentPlan];


    plan.innerHTML =
        "<h2>" +
        current.title +
        "</h2>";


    planTasks.innerHTML = "";


    current.tasks.forEach(
        function(task, index) {

            const savedState =
                getPlanTaskState(index);


            createPlanTask(
                task,
                index,
                savedState
            );

        }
    );


    document.getElementById(
        "planButton"
    ).textContent =
        current.nextButton;


    /*
       DATE + REPORT
       ONLY ON NIGHT PLAN
    */

    if (currentPlan === 3) {

        dateSection.style.display =
            "block";

        reportBox.style.display =
            "block";

    }

    else {

        dateSection.style.display =
            "none";

        reportBox.style.display =
            "none";

    }

}


/* =========================
   CREATE PLAN TASK
========================= */

function createPlanTask(
    taskText,
    index,
    checked
) {

    const task =
        document.createElement("label");


    task.className = "task";


    task.innerHTML = `

        <input
            type="checkbox"
            ${checked ? "checked" : ""}
        >

        <span class="task-text">
            ${taskText}
        </span>

    `;


    const checkbox =
        task.querySelector(
            'input[type="checkbox"]'
        );


    checkbox.addEventListener(
        "change",
        function() {

            savePlanTaskState(
                index,
                checkbox.checked
            );


            updateAll();

        }
    );


    planTasks.appendChild(task);

}


/* =========================
   PLAN TASK SAVE
========================= */

function getPlanTaskState(index) {

    const saved =
        localStorage.getItem(
            getStorageKey() +
            "_plan_" +
            currentPlan
        );


    if (!saved) {

        return false;

    }


    const states =
        JSON.parse(saved);


    return states[index] || false;

}


function savePlanTaskState(
    index,
    checked
) {

    const key =
        getStorageKey() +
        "_plan_" +
        currentPlan;


    let states = {};


    const saved =
        localStorage.getItem(key);


    if (saved) {

        states =
            JSON.parse(saved);

    }


    states[index] =
        checked;


    localStorage.setItem(
        key,
        JSON.stringify(states)
    );

}


/* =========================
   ADD CUSTOM TASK
========================= */

function addNewTask() {

    const text =
        taskInput.value.trim();


    const time =
        taskTime.value;


    if (text === "") {

        return;

    }


    customTasksData.push({

        text: text,

        time: time,

        completed: false

    });


    taskInput.value = "";

    taskTime.value = "";


    saveData();

    renderCustomTasks();

    updateAll();

}


document.getElementById(
    "addTaskButton"
).addEventListener(
    "click",
    addNewTask
);


taskInput.addEventListener(
    "keypress",
    function(e) {

        if (e.key === "Enter") {

            addNewTask();

        }

    }
);


/* =========================
   RENDER CUSTOM TASKS
========================= */

function renderCustomTasks() {

    customTasks.innerHTML = "";


    customTasksData.forEach(
        function(taskData, index) {

            const task =
                document.createElement("div");


            task.className =
                "task";


            task.setAttribute(
                "draggable",
                "true"
            );


            task.innerHTML = `

                <input
                    type="checkbox"
                    ${taskData.completed ? "checked" : ""}
                >

                <span class="task-text">
                    ${taskData.text}
                </span>

                ${
                    taskData.time
                    ?
                    `<span class="task-time">
                        ⏰ ${taskData.time}
                    </span>`
                    :
                    ""
                }

                <button
                    class="delete-task"
                    type="button"
                >
                    🗑️
                </button>

            `;


            const checkbox =
                task.querySelector(
                    'input[type="checkbox"]'
                );


            checkbox.addEventListener(
                "change",
                function() {

                    customTasksData[index]
                        .completed =
                        checkbox.checked;


                    saveData();

                    updateAll();

                }
            );


            const deleteButton =
                task.querySelector(
                    ".delete-task"
                );


            deleteButton.addEventListener(
                "click",
                function(e) {

                    e.stopPropagation();


                    customTasksData.splice(
                        index,
                        1
                    );


                    saveData();

                    renderCustomTasks();

                    updateAll();

                }
            );


            makeTaskDraggable(task);


            customTasks.appendChild(task);

        }
    );

}


/* =========================
   DRAG & DROP
========================= */

function makeTaskDraggable(
    taskElement
) {

    taskElement.addEventListener(
        "dragstart",
        function(e) {

            taskElement.classList.add(
                "dragging"
            );


            e.dataTransfer.setData(
                "text/plain",
                "task"
            );

        }
    );


    taskElement.addEventListener(
        "dragend",
        function() {

            taskElement.classList.remove(
                "dragging"
            );

        }
    );

}


const dropTrash =
    document.getElementById(
        "drop-trash"
    );


dropTrash.addEventListener(
    "dragover",
    function(e) {

        e.preventDefault();

        dropTrash.classList.add(
            "drag-over"
        );

    }
);


dropTrash.addEventListener(
    "dragleave",
    function() {

        dropTrash.classList.remove(
            "drag-over"
        );

    }
);


dropTrash.addEventListener(
    "drop",
    function(e) {

        e.preventDefault();


        dropTrash.classList.remove(
            "drag-over"
        );


        const dragging =
            document.querySelector(
                ".task.dragging"
            );


        if (dragging) {

            const deleteButton =
                dragging.querySelector(
                    ".delete-task"
                );


            if (deleteButton) {

                const allTasks =
                    Array.from(
                        customTasks.children
                    );


                const index =
                    allTasks.indexOf(
                        dragging
                    );


                if (index !== -1) {

                    customTasksData.splice(
                        index,
                        1
                    );

                }

            }


            dragging.remove();


            saveData();

            renderCustomTasks();

            updateAll();

        }

    }
);


/* =========================
   GET TASK COUNTS
========================= */

function getAllTaskCounts() {

    let total = 0;

    let completed = 0;


    const current =
        plans[currentPlan];


    total +=
        current.tasks.length;


    for (
        let i = 0;
        i < current.tasks.length;
        i++
    ) {

        if (
            getPlanTaskState(i)
        ) {

            completed++;

        }

    }


    total +=
        customTasksData.length;


    customTasksData.forEach(
        function(task) {

            if (task.completed) {

                completed++;

            }

        }
    );


    return {

        total: total,

        completed: completed

    };

}


/* =========================
   UPDATE EVERYTHING
========================= */

function updateAll() {

    renderCustomTasks();

    updateProgress();

    updateReport();

    updateCompletion();

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const counts =
        getAllTaskCounts();


    let progress = 0;


    if (counts.total > 0) {

        progress =
            Math.round(
                (
                    counts.completed /
                    counts.total
                ) * 100
            );

    }


    progressFill.style.width =
        progress + "%";


    progressText.textContent =
        "Progress: " +
        progress +
        "%";

}


/* =========================
   COMPLETION
========================= */

function updateCompletion() {

    const counts =
        getAllTaskCounts();


    const completionArea =
        document.getElementById(
            "completionArea"
        );


    if (
        counts.total > 0 &&
        counts.completed === counts.total
    ) {

        completionArea.style.display =
            "block";

    }

    else {

        completionArea.style.display =
            "none";


        document.getElementById(
            "message"
        ).style.display =
            "none";


        document.getElementById(
            "doneButton"
        ).style.display =
            "inline-block";

    }

}


document.getElementById(
    "doneButton"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "message"
        ).style.display =
            "block";


        this.style.display =
            "none";

    }
);


/* =========================
   DAILY REPORT
========================= */

function updateReport() {

    const counts =
        getAllTaskCounts();


    let progress = 0;


    if (counts.total > 0) {

        progress =
            Math.round(
                (
                    counts.completed /
                    counts.total
                ) * 100
            );

    }


    document.getElementById(
        "reportDate"
    ).textContent =
        selectedDate || "-";


    document.getElementById(
        "reportTotal"
    ).textContent =
        counts.total;


    document.getElementById(
        "reportCompleted"
    ).textContent =
        counts.completed;


    document.getElementById(
        "reportRemaining"
    ).textContent =
        counts.total -
        counts.completed;


    document.getElementById(
        "reportProgress"
    ).textContent =
        progress + "%";

}


/* =========================
   DAILY STREAK
========================= */

function calculateStreak() {

    let streak = 0;


    const today =
        new Date();


    for (
        let i = 0;
        i < 365;
        i++
    ) {

        const date =
            new Date(today);


        date.setDate(
            today.getDate() - i
        );


        const dateString =
            date.toISOString()
                .split("T")[0];


        if (
            isDayCompleted(
                dateString
            )
        ) {

            streak++;

        }

        else {

            break;

        }

    }


    return streak;

}


function isDayCompleted(
    dateString
) {

    const saved =
        localStorage.getItem(
            "dailyPlanner_" +
            dateString
        );


    if (!saved) {

        return false;

    }


    const data =
        JSON.parse(saved);


    const planIndex =
        data.currentPlan || 0;


    let total =
        plans[planIndex]
            .tasks.length;


    let completed = 0;


    const planStates =
        localStorage.getItem(
            "dailyPlanner_" +
            dateString +
            "_plan_" +
            planIndex
        );


    if (planStates) {

        const states =
            JSON.parse(planStates);


        plans[planIndex].tasks.forEach(
            function(_, index) {

                if (states[index]) {

                    completed++;

                }

            }
        );

    }


    const custom =
        data.customTasks || [];


    total += custom.length;


    custom.forEach(
        function(task) {

            if (task.completed) {

                completed++;

            }

        }
    );


    return (
        total > 0 &&
        completed === total
    );

}
